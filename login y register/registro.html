<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="../css/registro.css" />
    <title>Registrarse</title>
  </head>
  
  <body>
    <br><br><br>
    <center><h1>Registrarse</h1></center>
    <section class="section">
      <div class="container">
        <div class="columns is-centered">
          <div class="column is-5-desktop is-7-tablet is-12-mobile">
            <div class="box registro-box">
              <div class="has-text-centered mb-6">
              </div>
              <form>
                <div class="field">
                  <label class="label"> Nombre </label>

                  <div class="control">
                    <input class="input is-medium" type="text" name="nombre" placeholder="Ingrese su nombre" required/>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Correo electrónico </label>

                  <div class="control">
                    <input class="input is-medium" type="email" name="email" placeholder="Ingrese su email" required/>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Contraseña </label>

                  <div class="control">
                    <input class="input is-medium" type="password" name="password" placeholder="Contraseña" required/>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Fecha de nacimiento </label>

                  <div class="control">
                    <input class="input is-medium" type="date" id="fecha" name="fecha" required/>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Teléfono </label>

                  <div class="control">
                    <input class="input is-medium" type="tel" name="telefono" placeholder="Ingrese su teléfono" required/>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Departamento </label>

                  <div class="control">
                    <div class="select is-medium is-fullwidth">
                      <select name="departamento" required>
                        <option value="">Seleccione un departamento</option>

                        <option value="amazonas">Amazonas</option>
                        <option value="antioquia">Antioquia</option>
                        <option value="arauca">Arauca</option>
                        <option value="atlantico">Atlántico</option>
                        <option value="bolivar">Bolívar</option>
                        <option value="boyaca">Boyacá</option>
                        <option value="caldas">Caldas</option>
                        <option value="caqueta">Caquetá</option>
                        <option value="casanare">Casanare</option>
                        <option value="cauca">Cauca</option>
                        <option value="cesar">Cesar</option>
                        <option value="choco">Chocó</option>
                        <option value="cordoba">Córdoba</option>
                        <option value="cundinamarca">Cundinamarca</option>
                        <option value="guainia">Guainía</option>
                        <option value="guaviare">Guaviare</option>
                        <option value="huila">Huila</option>
                        <option value="la_guajira">La Guajira</option>
                        <option value="magdalena">Magdalena</option>
                        <option value="meta">Meta</option>
                        <option value="narino">Nariño</option>
                        <option value="norte_de_santander">
                          Norte de Santander
                        </option>
                        <option value="putumayo">Putumayo</option>
                        <option value="quindio">Quindío</option>
                        <option value="risaralda">Risaralda</option>
                        <option value="santander">Santander</option>
                        <option value="sucre">Sucre</option>
                        <option value="tolima">Tolima</option>
                        <option value="valle_del_cauca">Valle del Cauca</option>
                        <option value="vaupes">Vaupés</option>
                        <option value="vichada">Vichada</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Ciudad </label>

                  <div class="control">
                    <div class="select is-medium is-fullwidth">
                      <select name="ciudad" required>
                        <option value="">Seleccione una ciudad</option>

                        <option value="leticia">Leticia</option>

                        <option value="medellin">Medellín</option>
                        <option value="bello">Bello</option>
                        <option value="itagui">Itagüí</option>
                        <option value="envigado">Envigado</option>
                        <option value="apartado">Apartadó</option>
                        <option value="rionegro">Rionegro</option>

                        <option value="arauca">Arauca</option>
                        <option value="arauquita">Arauquita</option>
                        <option value="saravena">Saravena</option>

                        <option value="barranquilla">Barranquilla</option>
                        <option value="soledad">Soledad</option>
                        <option value="malambo">Malambo</option>
                        <option value="sabanalarga">Sabanalarga</option>

                        <option value="cartagena">Cartagena</option>
                        <option value="magangue">Magangué</option>
                        <option value="turbaco">Turbaco</option>

                        <option value="tunja">Tunja</option>
                        <option value="duitama">Duitama</option>
                        <option value="sogamoso">Sogamoso</option>

                        <option value="manizales">Manizales</option>
                        <option value="la_dorada">La Dorada</option>
                        <option value="villamaria">Villamaría</option>
                        <option value="chinchina">Chinchiná</option>
                        <option value="neira">Neira</option>

                        <option value="florencia">Florencia</option>
                        <option value="san_vicente">
                          San Vicente del Caguán
                        </option>

                        <option value="yopal">Yopal</option>
                        <option value="aguazul">Aguazul</option>
                        <option value="villanueva">Villanueva</option>

                        <option value="popayan">Popayán</option>
                        <option value="santander_de_quilichao">
                          Santander de Quilichao
                        </option>
                        <option value="puerto_tejada">Puerto Tejada</option>

                        <option value="valledupar">Valledupar</option>
                        <option value="aguachica">Aguachica</option>

                        <option value="quibdo">Quibdó</option>
                        <option value="istmina">Istmina</option>

                        <option value="monteria">Montería</option>
                        <option value="sahagun">Sahagún</option>
                        <option value="lorica">Lorica</option>

                        <option value="bogota">Bogotá D.C.</option>
                        <option value="soacha">Soacha</option>
                        <option value="chia">Chía</option>
                        <option value="zipaquira">Zipaquirá</option>

                        <option value="neiva">Neiva</option>
                        <option value="pitalito">Pitalito</option>

                        <option value="riohacha">Riohacha</option>
                        <option value="maicao">Maicao</option>

                        <option value="santa_marta">Santa Marta</option>
                        <option value="cienaga">Ciénaga</option>

                        <option value="villavicencio">Villavicencio</option>
                        <option value="acacias">Acacías</option>

                        <option value="pasto">Pasto</option>
                        <option value="tumaco">Tumaco</option>
                        <option value="ipiales">Ipiales</option>

                        <option value="cucuta">Cúcuta</option>
                        <option value="ocana">Ocaña</option>

                        <option value="mocoa">Mocoa</option>
                        <option value="puerto_asis">Puerto Asís</option>

                        <option value="armenia">Armenia</option>
                        <option value="calarca">Calarcá</option>

                        <option value="pereira">Pereira</option>
                        <option value="dosquebradas">Dosquebradas</option>

                        <option value="bucaramanga">Bucaramanga</option>
                        <option value="floridablanca">Floridablanca</option>
                        <option value="giron">Girón</option>

                        <option value="sincelejo">Sincelejo</option>

                        <option value="ibague">Ibagué</option>
                        <option value="espinal">El Espinal</option>
                        <option value="melgar">Melgar</option>

                        <option value="cali">Cali</option>
                        <option value="buenaventura">Buenaventura</option>
                        <option value="palmira">Palmira</option>
                        <option value="tulua">Tuluá</option>
                        <option value="buga">Buga</option>
                        <option value="cartago">Cartago</option>

                        <option value="mitu">Mitú</option>
                        <option value="puerto_carreno">Puerto Carreño</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Tipo de documento </label>

                  <div class="control">
                    <div class="select is-medium is-fullwidth">
                      <select name="tipo_documento" required>
                        <option value="">
                          Seleccione un tipo de documento
                        </option>

                        <option value="cedula">Cédula de ciudadanía</option>

                        <option value="extranjeria">
                          Cédula de extranjería
                        </option>

                        <option value="tarjeta">Tarjeta de identidad</option>

                        <option value="otro">Otro</option>
                      </select>
                    </div>
                  </div>
                </div>

                <div class="field">
                  <label class="label"> Número de documento </label>

                  <div class="control">
                    <input class="input is-medium" type="text" name="documento" placeholder="Ingrese su número de documento" required />
                  </div>
                </div>

                <div class="field mt-6">
                  <div class="control">
                    <button class="button is-primary is-medium is-fullwidth" type="submit">
                      Registrar
                    </button>
                  </div>
                </div>
              </form>

              <div class="has-text-centered mt-5">
                <a href="login.html"> ¿Ya tienes una cuenta? </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
