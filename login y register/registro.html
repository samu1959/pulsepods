<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PulsePods - Registro</title>

    <link rel="stylesheet" href="registro.css">

</head>


<body>


   

    <div class="registro">



        <div class="logo">
            PULSEPODS
        </div>


        <div class="linea"></div>


      

        <h1>
            Crear cuenta
        </h1>


        <p class="subtitulo">
            Regístrate para realizar tus pedidos
        </p>


      

        <form>


        

            <div class="campo">

                <label for="nombre">
                    Nombre completo
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Ej: Samuel Palacios"
                    required
                >

            </div>


          
            <div class="campo">

                <label for="correo">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    id="correo"
                    name="correo"
                    placeholder="Ej: correo@gmail.com"
                    required
                >

            </div>



            <div class="campo">

                <label for="telefono">
                    Teléfono
                </label>

                <input
                    type="tel"
                    id="telefono"
                    name="telefono"
                    placeholder="Ej: 300 123 4567"
                    required
                >

            </div>


        

            <div class="campo">

                <label for="password">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crea una contraseña"
                    required
                >

            </div>



            <div class="campo">

                <label for="confirmar">
                    Confirmar contraseña
                </label>

                <input
                    type="password"
                    id="confirmar"
                    name="confirmar"
                    placeholder="Repite tu contraseña"
                    required
                >

            </div>


           

            <div class="terminos">

                <input
                    type="checkbox"
                    id="terminos"
                    required
                >

                <label for="terminos">

                    Acepto los términos y condiciones
                    de PulsePods.

                </label>

            </div>


          

            <button
                type="subir"
                class="boton"
            >

                Crear cuenta

            </button>


        </form>


       

        <div class="login">

            <p>
                ¿Ya tienes una cuenta?
            </p>

            <a href="login.html">
                Iniciar sesión
            </a>

        </div>


        

        <a
            href="index.html"
            class="volver"
        >

             Volver al inicio

        </a>


    </div>


</body>

</html>
