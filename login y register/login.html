<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsePods</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
<br><br><br>
    <center>
        <h1>Iniciar Sesion</h1>
    </center>


    <div class="container">
        <br><br>
        <form class="box">
            <div class="field">
                <label class="label">Nombre</label>
                <div class="control">
                    <input class="input is-rounded" type="text" placeholder="ingrese su nombre" />
                </div>
            </div>

            <div class="field">
                <label class="label">Email</label>
                <div class="control">
                    <input class="input is-rounded" type="email" placeholder="ingrese su email" />
                </div>
            </div>

            <div class="field">
                <label class="label">Contraseña</label>
                <div class="control">
                    <input class="input is-rounded" type="password" placeholder="Contraseña" />
                </div>
            </div>

            <div class="field mt-6">
                  <div class="control">
                    <button class="button is-primary is-medium is-fullwidth" type="submit">
                      Iniciar Sesion
                    </button>
                  </div>
                </div>
              </form>
    </div>

</body>

</html>
