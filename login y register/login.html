<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulsePods</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="container">
        <br><br>
        <center>
            <h1 >Iniciar Sesion</h1>
        </center>
        <br><br>
        <div class="field">
            <label class="label">Email</label>
            <div class="control">
                <input id="email" class="input is-rounded" type="email" placeholder="Email" required />
            </div>
        </div>
        <div class="field">
            <label class="label">Nombre</label>
            <div class="control">
                <input id="nombre" class="input is-rounded" type="text" placeholder="Nombre De Usuario" required />
            </div>
        </div>
        <div class="field">
            <label class="label">Contraseña</label>
            <div class="control">
                <input id="contrasena" class="input is-rounded" type="text" placeholder="Contraseña" required />
            </div>
        </div>
        <br><br>
    </div>
    <div class="buttons is-flex is-justify-content-center">
        <a type="button" class="button is-danger" href="../index.html">Home</a>
        <button class="button is-info is-dark" id="btnGuardar">Guardar</button>
    </div>
</body>

</html>
