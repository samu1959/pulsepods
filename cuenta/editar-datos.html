<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="../css/editar-datos.css" />
    <title>PulsePods - Editar datos</title>
  </head>
  <body>
    <nav class="navbar" role="navigation" aria-label="main navigation">
      <div class="container">
        <div class="navbar-brand">
          <a class="navbar-item logo" href="../inicio/index.html">
            PULSEPODS
          </a>

          <a
            role="button"
            class="navbar-burger"
            id="burger"
            aria-label="menu"
            aria-expanded="false"
          >
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
            <span aria-hidden="true"></span>
          </a>
        </div>

        <div class="navbar-menu" id="menu">
          <div class="navbar-end">
            <a class="navbar-item" href="../inicio/index.html"> Inicio </a>

            <a class="navbar-item" href="../catalogo/catalogo.html">
              Catálogo
            </a>

            <a class="navbar-item" href="favoritos.html"> Favoritos </a>

            <a class="navbar-item" href="mispedidos.html"> Mis pedidos </a>

            <a class="navbar-item" href="cuenta.html"> Cuenta </a>
          </div>
        </div>
      </div>
    </nav>

    <section class="section">
      <div class="container">
        <div class="has-text-centered mb-6">
          <h1 class="title is-1">Editar datos</h1>

          <p class="subtitulo">
            Modifica la información de tu cuenta PulsePods
          </p>
        </div>

        <div class="columns is-centered">
          <div class="column is-8">
            <div class="box editar-box">
              <div class="encabezado-formulario">
                <div class="perfil-icono">👤</div>

                <div>
                  <h2>Información personal</h2>
                  <p>Actualiza los datos asociados a tu cuenta</p>
                </div>
              </div>

              <hr />

              <div class="columns">
                <div class="column">
                  <div class="field">
                    <label class="label"> Nombre </label>

                    <div class="control">
                      <input
                        class="input"
                        type="text"
                        placeholder="Tu nombre"
                      />
                    </div>
                  </div>
                </div>

                <div class="column">
                  <div class="field">
                    <label class="label"> Apellido </label>

                    <div class="control">
                      <input
                        class="input"
                        type="text"
                        placeholder="Tu apellido"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="field">
                <label class="label"> Correo electrónico </label>

                <div class="control">
                  <input
                    class="input"
                    type="email"
                    placeholder="correo@ejemplo.com"
                  />
                </div>
              </div>

              <div class="field">
                <label class="label"> Teléfono </label>

                <div class="control">
                  <input
                    class="input"
                    type="tel"
                    placeholder="Número de teléfono"
                  />
                </div>
              </div>

              <div class="field">
                <label class="label"> Dirección </label>

                <div class="control">
                  <input class="input" type="text" placeholder="Tu dirección" />
                </div>
              </div>

              <div class="columns">
                <div class="column">
                  <div class="field">
                    <label class="label"> Ciudad </label>

                    <div class="control">
                      <input
                        class="input"
                        type="text"
                        placeholder="Tu ciudad"
                      />
                    </div>
                  </div>
                </div>

                <div class="column">
                  <div class="field">
                    <label class="label"> Departamento </label>

                    <div class="control">
                      <input
                        class="input"
                        type="text"
                        placeholder="Tu departamento"
                      />
                    </div>
                  </div>
                </div>
              </div>

              <div class="field">
                <label class="label"> Código postal </label>

                <div class="control">
                  <input
                    class="input"
                    type="text"
                    placeholder="Código postal"
                  />
                </div>
              </div>
              <div class="field metodo-entrega">
                <label class="label"> Método de entrega </label>

                <div class="opciones-entrega">
                  <label class="radio opcion-entrega">
                    <input
                      type="radio"
                      name="metodoEntrega"
                      value="contra-entrega"
                    />
                    Pago contra entrega
                  </label>

                  <label class="radio opcion-entrega">
                    <input
                      type="radio"
                      name="metodoEntrega"
                      value="recoger-local"
                    />
                    Recoger en local
                  </label>
                </div>
              </div>

              <div class="botones">
                <button class="button boton-principal">Guardar cambios</button>

                <a href="datos.html" class="button boton-secundario">
                  Cancelar
                </a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script>
      const burger = document.getElementById("burger");
      const menu = document.getElementById("menu");

      burger.addEventListener("click", () => {
        burger.classList.toggle("is-active");
        menu.classList.toggle("is-active");
      });
    </script>
  </body>
</html>
